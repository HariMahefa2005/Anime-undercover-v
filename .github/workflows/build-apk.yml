name: Build Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP or locate project files
        run: |
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Décompression de $ZIP_FILE..."
              unzip -o "$ZIP_FILE"
            fi
          fi
          if [ ! -f "settings.gradle" ]; then
            SUB_SETTINGS=$(find . -mindepth 2 -maxdepth 3 -name "settings.gradle" | head -n 1)
            if [ -n "$SUB_SETTINGS" ]; then
              SUB_DIR=$(dirname "$SUB_SETTINGS")
              cp -rn "$SUB_DIR"/. .
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anime-Undercover-APK
          path: app/build/outputs/apk/debug/app-debug.apk
